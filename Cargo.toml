[package]
name = "tdf-iroh-s3"
version = "0.2.0"
edition = "2024"
rust-version = "1.91"
description = "Persistent Iroh peer node that validates incoming OpenTDF blobs and stores them in S3"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arkavo-org/tdf-iroh-s3"

[dependencies]
# Iroh networking and blobs
iroh = "1.4.1"
iroh-blobs = "0.104.1"
irpc = "0.17"

# OpenTDF validation
opentdf = { version = "0.16.0", default-features = false }

# AWS S3
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-ssm = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

# Hashing
blake3 = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization / config
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Error handling
anyhow = "1"
thiserror = "2"

# Misc
bytes = "1"
hex = "0.4"
iroh-base = "1.4.1"

# HTTP tag API (catalog discovery)
axum = "0.8"
http-body-util = "0.1"
futures = "0.3"
# Same version iroh-blobs uses: outboards and BAO encoding for serving from S3.
bao-tree = { version = "0.17", features = ["tokio_fsm", "validate"] }
iroh-io = "0.6"
serde_json = { version = "1", features = ["raw_value"] }
# Reading TDF archives from a file at ingest (the version opentdf uses)
zip = { version = "2.2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# CWT verification (COSE_Sign1, ES256) against identity.arkavo.net
coset = "0.3"
ciborium = "0.2"
p256 = { version = "0.13", features = ["ecdsa"] }
base64 = "0.22"
# WebAuthn assertions (catalog v2): SHA-256 of clientDataJSON and the challenge
sha2 = "0.10"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }

[dev-dependencies]
tempfile = "3"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
tower = { version = "0.5", features = ["util"] }
rcgen = "0.14.10"
# HTTP/2 for the HTTPS tests only; the node's own clients stay as configured above.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }

[[bin]]
name = "tdf-iroh-s3-test"
path = "src/bin/test_cli.rs"
